name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: pinterest-crawler-linux
            bin_suffix: ""
          - os: macos-latest
            asset_name: pinterest-crawler-macos-arm64
            bin_suffix: ""
          - os: macos-13
            asset_name: pinterest-crawler-macos-x86_64
            bin_suffix: ""
          - os: windows-latest
            asset_name: pinterest-crawler-windows.exe
            bin_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onefile --collect-all selenium --name main main.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/main${{ matrix.bin_suffix }}" "out/${{ matrix.asset_name }}"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
